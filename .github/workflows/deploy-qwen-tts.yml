name: Deploy qwen-tts to its own host

# Separate host from python-ai/Hetzner on purpose — see
# backend/qwen-tts/deploy/README.md. Mirrors deploy-python-ai.yml's
# SSH-runs-update.sh pattern with a distinct secret prefix (QWEN_TTS_*) so
# pushing to one service never deploys the other.

on:
  push:
    branches: [main]
    paths:
      - 'backend/qwen-tts/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-qwen-tts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        env:
          QWEN_TTS_HOST: ${{ secrets.QWEN_TTS_HOST }}
          QWEN_TTS_KNOWN_HOSTS: ${{ secrets.QWEN_TTS_KNOWN_HOSTS }}
          QWEN_TTS_SSH_KEY: ${{ secrets.QWEN_TTS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$QWEN_TTS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$QWEN_TTS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$QWEN_TTS_HOST" >> ~/.ssh/known_hosts
          fi
          umask 077
          printf '%s\n' "$QWEN_TTS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run deploy/update.sh on the server
        env:
          QWEN_TTS_HOST: ${{ secrets.QWEN_TTS_HOST }}
          QWEN_TTS_SSH_USER: ${{ secrets.QWEN_TTS_SSH_USER }}
          QWEN_TTS_SSH_PORT: ${{ secrets.QWEN_TTS_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o ConnectTimeout=15 \
              -p "${QWEN_TTS_SSH_PORT:-22}" \
              "${QWEN_TTS_SSH_USER}@${QWEN_TTS_HOST}" \
              'cd /opt/minallo/backend/qwen-tts && ./deploy/update.sh'

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
