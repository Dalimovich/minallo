<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />

  <!-- Returning-session shim: must be the very first thing in <head>, before
       any stylesheet or other script, so a logged-in visitor never paints
       the marketing page at all. Synchronous/local only (no network), same
       checks auth-bootstrap.js uses, so stale/old links (email confirm,
       OAuth callback, Stripe/PayPal return) that still target / keep
       working by forwarding straight to /app/ with the query/hash intact. -->
  <script>
  (function () {
    try {
      var loggedIn = false;
      try { loggedIn = sessionStorage.getItem('ss_logged_in') === 'true'; } catch (e) {}
      if (!loggedIn && location.hash && location.hash.indexOf('access_token') !== -1) loggedIn = true;
      if (!loggedIn) {
        try {
          var qp = new URLSearchParams(location.search);
          if (qp.get('token') || qp.get('token_hash') || qp.get('confirmation_token') || qp.get('code')) loggedIn = true;
        } catch (e) {}
      }
      if (!loggedIn) {
        try { if (sessionStorage.getItem('ss_force_app') === 'true') loggedIn = true; } catch (e) {}
      }
      if (!loggedIn) {
        try {
          if (localStorage.getItem('sb_sess_token') || sessionStorage.getItem('sb_sess_token') || localStorage.getItem('sb_sess_refresh')) loggedIn = true;
        } catch (e) {}
      }
      if (loggedIn) {
        location.replace('/app/' + location.search + location.hash);
      }
    } catch (e) {}
  })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Minallo - AI Exam Prep From Your Real Course Material</title>

       large image preview. Without max-snippet:-1 Google often truncates
       or omits the meta description in favor of an auto-generated one. -->

  <!-- Favicons. Google's SERP favicon picker wants at least 48x48; our
       /assets/favicon.png is 128x128 which qualifies. Declaring sizes="any"
       lets Google pick the file without us pre-committing to a single size. -->
  <link rel="icon" type="image/png" sizes="any" href="/assets/favicon.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="/assets/favicon.png" />
  <meta name="theme-color" content="#0b1220" />

  <!-- Manrope served from Bunny Fonts. Bunny is an EU-hosted (Slovenia),
       GDPR-friendly drop-in replacement for Google Fonts that does not log
       IPs — the privacy-conscious workaround for LG Muenchen I
       (3 O 17493/20). One narrow domain in the CSP. -->
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.bunny.net/css?family=manrope:400,500,600,700,800&display=swap"
  />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://fonts.bunny.net/manrope/files/manrope-latin-400-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://fonts.bunny.net/manrope/files/manrope-latin-700-normal.woff2" />
